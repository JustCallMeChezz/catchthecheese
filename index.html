    <style>
      :root{--cream:#fbf3e8;--milk:#fffaf2;--oat:#e6cdb0;--caramel:#b9784a;--cocoa:#58392b;--mocha:#80594a;--butter:#faebc9;--d:Chewy,Gaegu,system-ui,sans-serif}
      *{box-sizing:border-box}
      html,body{height:100%;margin:0;overflow:hidden;-webkit-tap-highlight-color:transparent}
      body{font:1.2rem Gaegu,"Patrick Hand",system-ui,sans-serif;color:var(--cocoa);background:linear-gradient(90deg,rgba(214,168,124,.2) 50%,transparent 50%) 0 0/44px 44px,linear-gradient(rgba(214,168,124,.2) 50%,transparent 50%) 0 0/44px 44px var(--cream)}
      #bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
      canvas{display:block;width:100%;height:100%}
      #startMenu{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center}
      #startMenu h1{margin:80px 10px 0;font:400 clamp(2.6rem,12vw,3.4rem)/1.1 var(--d);color:#fff;text-shadow:3px 3px 0 var(--cocoa)}
      #startMenu img{max-width:80%;height:auto;margin-top:-10px}
      #startButton{margin-bottom:100px}
      button{padding:.4rem 1.6rem;font:1.35rem var(--d);color:var(--cocoa);background:var(--butter);border:2px solid var(--cocoa);border-radius:999px;box-shadow:0 5px 0 var(--cocoa);cursor:pointer;transition:transform .15s,box-shadow .15s,background-color .2s}
      button:hover{background:#fbe4a0;transform:translateY(-2px);box-shadow:0 7px 0 var(--cocoa)}
      button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cocoa)}
      .cute-bouncyy{animation:bounce .4s ease-in-out}
      @keyframes bounce{30%{scale:.95}50%{scale:1.1}70%{scale:.98}}
      #scoreboard,#digitalClock{position:absolute;top:10px;z-index:2;padding:0 .8rem;font-size:1.1rem;background:rgba(255,250,242,.88);border:2px solid var(--oat);border-radius:999px;box-shadow:0 3px 0 var(--oat)}
      #scoreboard{right:10px}
      #digitalClock{left:10px}
      #scoreboard i{color:var(--caramel)}
      #scoreboard i:not(:first-child){margin-left:.6rem}
      #gameOverPopup{position:fixed;top:50%;left:50%;translate:-50% -50%;z-index:10;display:none;width:min(86vw,360px);padding:1.3rem 1.5rem;text-align:center;background:var(--milk);border:2px solid var(--oat);border-radius:30px;box-shadow:0 6px 0 var(--oat)}
      #gameOverPopup h2{margin:0 0 .4rem;font:400 2.2rem/1.1 var(--d);text-shadow:2px 2px 0 var(--butter)}
      #gameOverPopup p{margin:0 0 1.2rem;color:var(--mocha)}
      #landscapeMessage{display:none}
      @media(orientation:landscape),(min-width:768px){
        body{display:flex;justify-content:center;align-items:center;padding:1rem;font-size:1.4rem;text-align:center}
        #landscapeMessage{display:block;max-width:34ch;padding:1.2rem 1.6rem;background:var(--milk);border:2px solid var(--oat);border-radius:30px;box-shadow:0 6px 0 var(--oat)}
        #bg,canvas,#startMenu,#gameOverPopup,#scoreboard,#digitalClock{display:none!important}
      }
      @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    </style>
